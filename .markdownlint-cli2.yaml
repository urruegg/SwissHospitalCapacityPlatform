config:
  # Long requirement and traceability lines are expected in governance docs.
  MD013: false

  # Repository prose intentionally uses compact list formatting in several
  # baseline documents.
  MD032: false

  # Some imported baseline artifacts currently contain tabs.
  MD010: false

  # Documentation reference sections include plain URLs by design.
  MD034: false

  # Heading-level increments and surrounding-blank-line rules are relaxed to
  # match imported baseline documents in .github/copilot-instructions.md.
  MD001: false
  MD022: false
  MD058: false

  # Several governance documents use 1-space sub-list indentation and
  # restart-numbered sub-lists; accepted as baseline house style for now.
  MD007: false
  MD029: false

  # Imported baseline docs contain intentional visual section spacing.
  MD012: false

  # Table pipe spacing (compact vs. padded) is mixed across baseline
  # governance docs; enforcing a single style adds churn without
  # improving readability.
  MD060: false

ignores:
  # Skills are imported verbatim from external repositories
  # (microsoft/skills-for-fabric, PBI-Guy/Power-BI-Optimization-Skill,
  # github/awesome-copilot). They must not be modified for style compliance;
  # exclude from linting.
  - ".github/skills/**"
  # Custom agent personas (.agent.md) and canvas extensions imported verbatim
  # from github/awesome-copilot -- same "don't rewrite external content" rule
  # as skills above. This repo's own README.md wrappers for these folders
  # still lint normally.
  - ".github/agents/*.agent.md"
  - ".github/extensions/**/*.mjs"
  - ".github/extensions/**/README.md"
