# Per-persona golden-question harness for the Curavias Product Owner Agent.
#
# Sprint 28 (issue #377), WS-RT Task RT.2. All questions and grounded
# chunks are SYNTHETIC - no PHI, no secrets, no real financials. Each entry
# is deterministic: the harness (run_evals.run_suite) feeds the listed
# chunks to the orchestrator as read-only tool output, then asserts the
# grounded-answer contract (>= 95% citation coverage, zero CFO/CISO/CLO
# hallucination, correct partner refusal).
#
# Fields:
#   id        stable identifier
#   persona   board persona (CEO/COO/CIO/CFO/CTO/CISO/CDO/CLO/Developer/
#             Architect/PM/Partner)
#   language  de | en (UI + answer language)
#   tier      internal | partner (caller entitlement)
#   question  the natural-language question
#   expect    answer | refusal
#   chunks    the synthetic grounded chunks the class tools return
version: 1.0.0

questions:
  - id: ceo-en-01
    persona: CEO
    language: en
    tier: internal
    question: What is the strategic value case for the Curavias MVP?
    expect: answer
    chunks:
      - classId: A
        text: The MVP targets patient-flow and capacity optimisation across acute, rehab and Spitex providers.
        sourceRef: docs/PRD.md#vision
        confidence: 0.9
        status: verified
        language: en

  - id: coo-de-01
