agent: dca-agent
version: 1.1.0
runtime: agent-host
modelDeploymentRef: sprint11-chat  # resolved by the Sprint 13 agent-host per ADR-0020
modelSelectionAdr: docs/adr/0020-sprint11-agent-model-selection.md
systemPromptRef: ./AGENT.md
refusalRulesRef: ./AGENT.md#5-refusal-rules
mcpTools:
  - server: fabric-mcp
    tools: [query]
    ceiling: read
  - server: github-mcp
    tools: [get-issue, add-issue-comment, create-branch, create-or-update-file]
    ceiling: write
hitl:
  gates: [HITL-03]  # cross-organisational handoff initiation
grounding:
  # Table names reconciled with actual Fabric lakehouse gold schema (2026-07-09 verification).
  - table: gold.discharge_score         # was Gold.DischargeReadiness
    scope: hospital
  - table: gold.discharge_recommendation # was Gold.CareTransitionBlockers — blockers surfaced via recommendation reasons
    scope: hospital
  - table: gold.encounter               # was Gold.LengthOfStay — derived from encounter start/end
    scope: hospital
goldenTasksRef: ./golden-tasks.md
