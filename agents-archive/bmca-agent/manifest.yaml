agent: bmca-agent
version: 1.0.0
runtime: agent-host
modelDeploymentRef: sprint11-chat  # resolved by the Sprint 13 agent-host per ADR-0020
modelSelectionAdr: docs/adr/0020-sprint11-agent-model-selection.md
systemPromptRef: ./AGENT.md
refusalRulesRef: ./AGENT.md#5-refusal-rules
mcpTools:
  - server: fabric-mcp
    tools: [query]
    ceiling: read
  - server: github-mcp
    tools: [get-issue, add-issue-comment, create-branch, create-or-update-file]
    ceiling: write
hitl:
  # per ADR-0007 §3 — the downstream gate governing actions this agent recommends
  gates: [HITL-02]  # bed transfer / reprioritisation
grounding:
  - table: Gold.BedState
    scope: hospital
  - table: Gold.WardCapacity
    scope: hospital
  - table: Gold.DischargeReadiness
    scope: hospital
goldenTasksRef: ./golden-tasks.md
