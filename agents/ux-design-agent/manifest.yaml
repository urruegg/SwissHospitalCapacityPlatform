agent: ux-design-agent
version: 1.1.0
runtime: copilot-coding-agent          # control-plane, per ADR-0002 (not the Sprint 13 agent-host)
invocation: issue-triggered            # @ux-design-agent mention or any UX-improvement issue; anchored repo-wide for UX questions
approvalIssue: 258                     # human-authored governance issue that authorised this agent
systemPromptRef: ./AGENT.md
refusalRulesRef: ./AGENT.md#5-refusal-rules
skillRef: brainstorming                # + writing-plans (handoff), powerbi-report-authoring, powerbi-optimization
localTools:                            # run in the agent harness / visual companion, not via MCP
  - brainstorming-visual-companion
  - markdownlint-cli2
  - "@playwright/test"                 # standalone visual + E2E verification (apps/hcc-app-fluent + rendered mockups)
  - "@axe-core/playwright"             # WCAG / axe accessibility scans
mcpTools:
  - server: github-mcp
    tools: [get-issue, add-issue-comment, create-branch, create-or-update-file, create-pull-request]
    ceiling: write
  - server: playwright-mcp             # "within VS Code / share context with GitHub Copilot" mode; example wiring in .vscode/mcp.json
    tools: [browser_navigate, browser_snapshot, browser_take_screenshot, browser_resize, browser_console_messages]
    ceiling: read
hitl:
  gates: []                            # ceiling is write; no deploy/delete, so no approved-to-apply gate
grounding:
  - source: docs/superpowers/specs/2026-07-17-sprint-20-curavias-ux-design.md
    scope: five-plane-curavias-shell
  - source: docs/superpowers/ideas/curavias-ux-ideas
    scope: brainstorming-baseline-mockup
  - source: docs/brandkit
    scope: curavias-brand-tokens
  - source: docs/PRD.md
    scope: fr-cx-fr-viz-nfr-gov-003-nfr-rel-003
goldenTasksRef: ./golden-tasks.md
