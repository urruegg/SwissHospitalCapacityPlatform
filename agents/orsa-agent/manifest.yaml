agent: orsa-agent
version: 1.1.0
runtime: agent-host
modelDeploymentRef: sprint11-chat  # resolved by the Sprint 13 agent-host per ADR-0020
modelSelectionAdr: docs/adr/0020-sprint11-agent-model-selection.md
systemPromptRef: ./AGENT.md
refusalRulesRef: ./AGENT.md#5-refusal-rules
mcpTools:
  - server: fabric-mcp
    tools: [query]
    ceiling: read
  - server: github-mcp
    tools: [get-issue, add-issue-comment, create-branch, create-or-update-file]
    ceiling: write
hitl:
  gates: [HITL-01]  # patient-affecting workflow trigger (surgical slate)
grounding:
  # Table names reconciled with actual Fabric lakehouse gold schema (2026-07-09 verification).
  - table: gold.or_schedule             # was Gold.ORSlate
    scope: hospital
  - table: gold.anaesthesia_status      # was Gold.AnaesthesiaStatus
    scope: hospital
    status: pending                     # NOT YET IN SPRINT 10 MEDALLION; may derive from gold.or_case eventType sequence
  - table: gold.staff_availability      # was Gold.StaffAvailability
    scope: hospital
    status: pending                     # NOT YET IN SPRINT 10 MEDALLION; see companion backlog issue
goldenTasksRef: ./golden-tasks.md
