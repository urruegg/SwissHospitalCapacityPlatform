agent: knowledge-agent
version: 1.0.0
runtime: copilot-coding-agent          # control-plane, per ADR-0002 (not the Sprint 13 agent-host)
invocation: issue-triggered            # @knowledge-agent mention or a doc-steward issue; also usable as the document-authoring skill from Copilot CLI
approvalIssue: 242                      # human-authored governance issue that authorised this agent
systemPromptRef: ./AGENT.md
refusalRulesRef: ./AGENT.md#5-refusal-rules
skillRef: ../../.github/skills/document-authoring/SKILL.md
localTools:                            # run in the agent harness, not via MCP
  - scripts/lint/check_mojibake.py
  - scripts/lint/fix_mojibake.py
  - markdownlint-cli2
mcpTools:
  - server: github-mcp
    tools: [get-issue, add-issue-comment, create-branch, create-or-update-file, create-pull-request]
    ceiling: write
hitl:
  gates: []                            # ceiling is write; no deploy/delete, so no approved-to-apply gate
grounding:
  - source: .github/copilot-instructions.md
    scope: section-9-document-versioning
  - source: docs/PRD.md
    scope: fr-nfr-ids-and-section-7-matrix
goldenTasksRef: ./golden-tasks.md
