agent: csa-agent
version: 1.0.0
runtime: agent-host
scaffold: false  # full Prepare/Run/Evaluate/Recommend body (Sprint 16 T4)
modelDeploymentRef: sprint11-chat  # resolved by the Sprint 13 agent-host per ADR-0020
modelSelectionAdr: docs/adr/0020-sprint11-agent-model-selection.md
systemPromptRef: ./AGENT.md
refusalRulesRef: ./AGENT.md#5-refusal-rules
mcpTools:
  - server: github-mcp
    tools: [get-issue, add-issue-comment, create-pull-request]
    ceiling: write
  - server: fabric-mcp
    tools: [query, run-notebook]  # run-notebook triggers csa-simulate (deploy-class, gated)
    ceiling: write
  - server: cosmos-mcp
    tools: [vector-query, read-item, upsert-item]
    ceiling: write
# Overall effective ceiling is `deploy` (gated): the Run phase triggers a Fabric
# simulation notebook, which requires the AGENTS.md §4 approved-to-apply gate.
ceiling: deploy
hitl:
  # ACTIVE as of Sprint 16 — HITL-01 gates the simulation-run trigger
  # (approved-to-apply); HITL-04 gates the recommendation draft PR (human marks
  # ready). The agent never self-approves.
  gates: [HITL-01, HITL-04]
  inert_until: null
grounding:
  - cosmos:scenarios          # vector search over seeded + user scenarios
  - cosmos:response-levers    # ~80-lever doctrine library
  - cosmos:agent-memory       # per-thread context
  - fabric:gold-capacity      # Gold capacity data + DC-SIM-RESULT
  - adr:0024-csa-tier-classifier-rules
goldenTasksRef: ./golden-tasks.md
