# Grounding map for capacity-dashboard v2 (design spec §7, plan Task 6.1).
# Human-readable source of truth for the `page-grounding` matrix. The
# `grounding` calculated table in the SemanticModel mirrors these rows so the
# matrix can render bound content; keep the two in sync when editing.
#
# Columns:
#   requirement — FR-*/NFR-* ID from docs/PRD.md
#   adr         — governing ADR under docs/adr/
#   entity      — ontology entity (hcp:<Entity>) the row grounds against
#   measure     — semantic-model measure the visual surfaces
#   location    — page + visual where the requirement is demonstrated
