# Fabric IQ release-train variable library
#
# Maps each environment to its Fabric workspace + lakehouse coordinates, so the
# same parameterized `fabric-cicd` deploy targets a different workspace by
# changing the `--environment` value only (readiness design D5/D7).
#
# Region note: both SIT and PROD Fabric run in westus2 per ADR-0035 (the
# subscription has 0 CU Fabric quota in eastus2). Re-pointing to eastus2 later is
# a value change here + in parameter.yml, not a rebuild.
#
# These GUIDs are deployment coordinates, not secrets. The SIT workspace +
# lakehouse GUIDs already appear in the committed Direct Lake TMDL
# (capacity-dashboard.SemanticModel/definition/expressions.tmdl).

environments:
  SIT:
    workspace_name: ws-ihzhhpf-sit-data
    workspace_id: f3af9733-9503-4e92-98f9-a901d96f1c87
    lakehouse_name: lh_ihzhhpf_sit
    lakehouse_id: 30594c20-46ba-40ea-91fa-4701b105e0b9
    capacity_name: fabricihzhhpfsit
    region: westus2
  PROD:
    workspace_name: ws-ihzhhpf-prod-data
    workspace_id: 399b73f6-4b1c-44da-b7f9-1b4a37525a2b
    lakehouse_name: lh_ihzhhpf_prod
    lakehouse_id: e74276f6-a00b-46de-9265-c6462c8faa17
    capacity_name: fabricihzhhpfprod
    region: westus2
