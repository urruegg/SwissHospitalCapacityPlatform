## Lychee link checker configuration (compatible with lychee v0.18.1).

max_concurrency = 4
max_retries = 2
retry_wait_time = 2
timeout = 20

# Be lenient on common transient and rate-limited responses.
accept = [200, 206, 301, 302, 304, 403, 429]

# Skip mail/file schemes and localhost.
exclude = [
  "^mailto:",
  "^file:",
  "^https?://localhost",
  # Phantom URLs lychee extracts from prose like "AI-Powered",
  # "Patient Flow" (no dot in host => not a real URL).
  "^https?://[^/.]+/?$",
]

cache = true
no_progress = true
