[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hcc-agent-host"
version = "0.1.0"
description = "Sprint 13 Container Apps agent-host: loads Sprint 11 prompt manifests and dispatches to a Microsoft Foundry chat model (ADR-0008 + ADR-0007)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn>=0.32,<0.35",
  "pydantic>=2.9,<3",
  "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
# Real Azure/Foundry SDKs — only needed for live runtime, not for unit tests.
runtime = [
  "azure-identity>=1.19,<2",
  "azure-cosmos>=4.7,<5",
  "redis>=5.1,<6",
  "openai>=1.55,<2",
  "azure-monitor-opentelemetry>=1.6,<2",
]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
