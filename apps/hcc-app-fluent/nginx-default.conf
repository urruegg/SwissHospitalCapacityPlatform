# SPA history-API fallback for the hcc-app-fluent client-routed bundle.
# Without try_files ... /index.html, deep-links to client routes (e.g.
# /backstage/story) 404 because nginx looks for a matching file on disk (#299).
# Port 8080 matches the nginxinc/nginx-unprivileged default (non-root).

server {
    listen       8080;
    listen  [::]:8080;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # Client-side routing: serve index.html for any path that is not a real file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache immutable, content-hashed build assets.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the app shell so new deployments are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # #447 runtime config: regenerated per-env at container start; never cache it
    # so an environment's agent-host URL is always the freshly-injected value.
    location = /env-config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
