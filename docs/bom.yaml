# Bill of Materials (BOM) — Swiss Hospital Capacity Platform
#
# Seed catalog for the Sprint 14 Showcase Evidence data product.
# Parsed by scripts/evidence/parsers/bom_parser.py into
# data/evidence/bom.json + data/evidence/dependencies.json.
#
# Contract: docs/bom.schema.md (human-readable) + data/evidence/schema/bom.schema.json.
#
# Conventions:
#   id                    kebab-case, prefixed "bom-"
#   category              one of: data | ai | app | integration | security | platform | governance
#   realisesRequirements  FR-*/NFR-* IDs from docs/PRD.md
#   governedByAdrs        ADR-#### IDs from docs/adr/
#   dependsOn[].type      one of: requires | hosts | grounds | binds | governs
#
# Region-availability facts for each item live in docs/region-availability.yaml.

version: 1.1.0
# 1.1.0 (2026-07-21): fabric-capacity SKU corrected F64->F2 to match the live
# SIT/PROD deployment (verified via `az resource show`, ADR-0037 evidence).
items:
  - id: bom-fabric-capacity
    name: Microsoft Fabric Capacity
    type: Microsoft.Fabric/capacities
    category: platform
    sku: F2
    realisesRequirements: [FR-DATA-003, FR-DATA-005]
    governedByAdrs: [ADR-0012, ADR-0013, ADR-0015]

  - id: bom-fabric-workspace-data
    name: Fabric Data Workspace (ws-ihzhhpf-sit-data)
    type: Microsoft.Fabric/workspaces
    category: platform
    realisesRequirements: [FR-DATA-003]
    governedByAdrs: [ADR-0012]
    dependsOn:
      - to: bom-fabric-capacity
        type: hosts

  - id: bom-onelake
