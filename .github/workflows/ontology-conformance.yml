name: ontology-conformance

on:
  pull_request:
    paths:
      - "docs/ontology/**"
      - "scripts/ontology/**"
      - "data/synthetic/schema/**"
      - ".github/workflows/ontology-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crosswalk-conformance:
    runs-on: ubuntu-latest
    name: Two-layer crosswalk conformance (STRICT)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # STRICT mode. Any WARN or FAIL from the check fails the build.
      # Semantics per docs/ontology/CI_DESIGN.md v1.0.0 (Sprint 09 v2.0.0
      # refinement, plan T1.6). No pip install needed — the script uses only
      # stdlib.
      - name: Run crosswalk conformance check (STRICT)
        run: |
          python scripts/ontology/check_crosswalk_conformance.py --strict

