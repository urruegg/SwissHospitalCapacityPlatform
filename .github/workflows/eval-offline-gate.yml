name: eval-offline-gate

# Sprint 30 M3 -- offline evaluation regression gate.
#
# Runs the shared evaluator library (evals/lib) over the ooa-agent v1 golden
# dataset of DC-AGENT-INTERACTION-v1 records. All six seed evaluators are
# deterministic and stdlib-only (plus jsonschema for the dataset schema test),
# so the suite needs no model access. Gate: citation coverage >= 0.95 and zero
# failures on groundedness, refusal-correctness, PHI-leak, actionability, and
# advisory-voice (design section 7).
#
# Runs "on every prompt / knowledge / model change" for the lead agent: it
# triggers on the evaluator library, the golden dataset, the interaction
# contract, and the ooa-agent prompt/manifest surface.

on:
  pull_request:
    paths:
      - 'evals/lib/**'
      - 'evals/ooa-agent/**'
      - 'data/synthetic/schema/agent-interaction-v1.schema.json'
      - 'agents/ooa-agent/**'
      - '.github/workflows/eval-offline-gate.yml'
  push:
    branches: [main]
    paths:
      - 'evals/lib/**'
      - 'evals/ooa-agent/**'
      - 'data/synthetic/schema/agent-interaction-v1.schema.json'
      - 'agents/ooa-agent/**'
      - '.github/workflows/eval-offline-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eval-offline-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-gate:
    name: Offline evaluation gate (evaluator library + ooa-agent golden dataset)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test deps
        shell: bash
        run: |
          set -euo pipefail
          pip install pytest jsonschema

      - name: Run evaluator library + offline regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest evals/lib/tests evals/ooa-agent/tests -q

      - name: Print ooa-agent gate report
        shell: bash
        run: |
          set -euo pipefail
          python evals/ooa-agent/run_evals.py
