name: evidence-publish

# Sprint 14 · T1 — Showcase Evidence data product.
#
# On PR / push: self-test the evidence parsers and validate their output against
# the JSON Schemas. On push to `main`: regenerate data/evidence/*.json and
# publish it to the standalone `evidence-latest` branch (single rewound commit
# per push — the evidence JSON is intentionally NEVER merged into `main` to
# avoid history bloat; design spec §11).

on:
  pull_request:
    paths:
      - 'scripts/evidence/**'
      - 'data/evidence/schema/**'
      - 'docs/PRD.md'
      - 'docs/adr/**'
      - 'docs/bom.yaml'
      - 'docs/region-availability.yaml'
      - 'docs/adr-requirement-map.yaml'
      - '.github/workflows/evidence-publish.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/evidence/**'
      - 'data/evidence/schema/**'
      - 'docs/PRD.md'
      - 'docs/adr/**'
      - 'docs/bom.yaml'
      - 'docs/region-availability.yaml'
      - 'docs/adr-requirement-map.yaml'
      - 'infra/**'
      - '.github/workflows/evidence-publish.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence-selftest:
    name: Evidence parser self-test + schema validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install "PyYAML>=6.0" "jsonschema>=4.0"

      - name: Run parser unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/evidence/tests -t . -v

      - name: Build + validate evidence outputs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.evidence.publish --repo-root . --out data/evidence
          python3 - <<'PY'
          import json, pathlib
          from jsonschema import validate
          out = pathlib.Path("data/evidence")
          schema = pathlib.Path("data/evidence/schema")
          mapping = {
              "requirements.json": "requirements",
              "adrs.json": "adrs",
              "req_adr_map.json": "req_adr_map",
              "bom.json": "bom",
              "dependencies.json": "dependencies",
              "region_availability.json": "region_availability",
              "deployed_bom.json": "deployed_bom",
          }
          for f, s in mapping.items():
              validate(json.loads((out / f).read_text()), json.loads((schema / f"{s}.schema.json").read_text()))
              print(f"validated {f}")
          PY

  evidence-publish:
    name: Publish evidence to evidence-latest branch
    runs-on: ubuntu-latest
    needs: evidence-selftest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install "PyYAML>=6.0"

      - name: Generate evidence JSON
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/evidence-pub"
          mkdir -p "${RUNNER_TEMP}/evidence-pub/data/evidence"
          python3 -m scripts.evidence.publish \
            --repo-root . \
            --out "${RUNNER_TEMP}/evidence-pub/data/evidence"
          cp data/evidence/schema/*.schema.json "${RUNNER_TEMP}/evidence-pub/data/evidence/" 2>/dev/null || true

      - name: Publish to evidence-latest branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/evidence-pub"
          cat > README.md <<EOF
          # evidence-latest

          Auto-generated by \`.github/workflows/evidence-publish.yml\` from
          commit ${GITHUB_SHA}. Do NOT edit by hand and do NOT merge into main.
          EOF
          git init -q
          git checkout -q -b evidence-latest
          git add .
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "chore(evidence): publish from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" evidence-latest
