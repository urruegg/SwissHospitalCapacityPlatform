name: cd-infra-deploy-prod

on:
  workflow_run:
    workflows:
      - cd-infra-deploy-sit
    types:
      - completed
  workflow_dispatch:
    inputs:
      confirm:
        description: Type 'approved-to-apply' to confirm production deployment.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy-prod:
    name: Deploy PROD
    runs-on: ubuntu-latest
    environment:
      name: prod
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'approved-to-apply') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Validate required environment configuration (PROD)
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          BICEP_PARAM_FILE: ${{ vars.BICEP_PARAM_FILE }}
        run: |
          set -euo pipefail
          test -n "$AZURE_CLIENT_ID"
          test -n "$AZURE_TENANT_ID"
          test -n "$AZURE_SUBSCRIPTION_ID"
          test -n "$AZURE_RESOURCE_GROUP"
          test -n "$BICEP_PARAM_FILE"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: What-if before deploy (PROD)
        shell: bash
        run: |
          set -euo pipefail
          az deployment group what-if \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters "${{ vars.BICEP_PARAM_FILE }}"

      - name: Deploy (PROD)
        shell: bash
        run: |
          set -euo pipefail
          az deployment group create \
            --name "deploy-prod-${{ github.run_id }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters "${{ vars.BICEP_PARAM_FILE }}"
