name: cd-infra-deploy-prod

on:
  workflow_run:
    workflows:
      - cd-infra-deploy-sit
    types:
      - completed
  workflow_dispatch:
    inputs:
      confirm:
        description: Type 'approved-to-apply' to confirm production deployment.
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Run the policy gate in a separate, unprivileged job (no id-token) so that
  # repository code is never executed in the privileged deploy job that holds
  # the Azure OIDC token. The deploy job depends on this gate, so a critical
  # policy failure or expired exception blocks PROD promotion.
  policy-gate:
    name: Policy gate (PROD promotion, blocking)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'approved-to-apply') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run policy gate (PROD scope)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p policy-evidence
          python3 policy/policy_gate.py \
            --scope prod \
            --repo-root . \
            --pipeline-run-id "${GITHUB_RUN_ID}" \
            --output "policy-evidence/policy-gate-prod.json"

      - name: Upload PROD policy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-gate-evidence-prod
          path: policy-evidence/
          if-no-files-found: error

  deploy-prod:
    name: Deploy PROD
    runs-on: ubuntu-latest
    needs: policy-gate
    environment:
      name: prod
    permissions:
      contents: read
      id-token: write
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'approved-to-apply') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Validate required environment configuration (PROD)
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          BICEP_PARAM_FILE: ${{ vars.BICEP_PARAM_FILE }}
        run: |
          set -euo pipefail
          test -n "$AZURE_CLIENT_ID"
          test -n "$AZURE_TENANT_ID"
          test -n "$AZURE_SUBSCRIPTION_ID"
          test -n "$AZURE_RESOURCE_GROUP"
          test -n "$BICEP_PARAM_FILE"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure required resource providers are registered (PROD)
        shell: bash
        run: |
          set -euo pipefail
          providers=(
            Microsoft.OperationalInsights
            Microsoft.KeyVault
            Microsoft.ManagedIdentity
            Microsoft.Network
            Microsoft.Insights
            Microsoft.Storage
            Microsoft.CognitiveServices
            Microsoft.ServiceBus
            Microsoft.Web
            Microsoft.ContainerRegistry
            Microsoft.EventHub
            Microsoft.MachineLearningServices
            Microsoft.Logic
            # Microsoft.App = Container Apps control plane. Required whenever
            # a Container Apps Environment or Container App resource is
            # deployed. Historically auto-registered by first CAE create,
            # but declaring it explicitly makes the workflow bulletproof.
            Microsoft.App
            # Microsoft.ContainerService = required for Container Apps
            # Environment VNet integration (ADR-0029 Option A). The CAE
            # internally provisions AKS-managed infra when infrastructureSubnetId
            # is set; without this RP the deploy fails with
            # SubscriptionIsNotRegistered on Microsoft.App/managedEnvironments.
            Microsoft.ContainerService
          )

          for p in "${providers[@]}"; do
            state=$(az provider show --namespace "$p" --query registrationState -o tsv || echo "NotRegistered")
            if [ "$state" != "Registered" ]; then
              if ! az provider register --namespace "$p" --wait; then
                echo "::warning::Unable to register provider $p. Continuing with current registration state."
              fi
            fi
          done

      - name: What-if before deploy (PROD)
        shell: bash
        run: |
          set -euo pipefail
          az deployment group what-if \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters "${{ vars.BICEP_PARAM_FILE }}"

      - name: Deploy (PROD)
        shell: bash
        run: |
          set -euo pipefail
          az deployment group create \
            --name "deploy-prod-${{ github.run_id }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters "${{ vars.BICEP_PARAM_FILE }}"
