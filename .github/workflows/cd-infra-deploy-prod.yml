name: cd-infra-deploy-prod

on:
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      confirm:
        description: Type 'approved-to-apply' to confirm production deployment.
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  actions: read
  pull-requests: read

jobs:
  deploy-prod:
    name: Deploy PROD
    runs-on: ubuntu-latest
    environment:
      name: prod
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'approved-to-apply') ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.state == 'approved' &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.draft == false &&
       contains(join(github.event.pull_request.labels.*.name, ','), 'promote-prod'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_review' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify SIT deployment succeeded for PR head
        if: github.event_name == 'pull_request_review'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headSha = context.payload.pull_request.head.sha;
            const workflowFileName = 'cd-infra-deploy-sit.yml';

            const runs = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: workflowFileName,
              head_sha: headSha,
              per_page: 20
            });

            const success = runs.data.workflow_runs.some(r => r.conclusion === 'success');
            if (!success) {
              core.setFailed(`No successful ${workflowFileName} run found for head SHA ${headSha}.`);
            }

      - name: Validate required environment configuration (PROD)
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          BICEP_PARAM_FILE: ${{ vars.BICEP_PARAM_FILE }}
        run: |
          set -euo pipefail
          test -n "$AZURE_CLIENT_ID"
          test -n "$AZURE_TENANT_ID"
          test -n "$AZURE_SUBSCRIPTION_ID"
          test -n "$AZURE_RESOURCE_GROUP"
          test -n "$BICEP_PARAM_FILE"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: What-if before deploy (PROD)
        shell: bash
        run: |
          set -euo pipefail
          az deployment group what-if \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters "${{ vars.BICEP_PARAM_FILE }}"

      - name: Deploy (PROD)
        shell: bash
        run: |
          set -euo pipefail
          az deployment group create \
            --name "deploy-prod-${{ github.run_id }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters "${{ vars.BICEP_PARAM_FILE }}"
