name: ci-build-signal-runner

# Sprint 44 Layer 2 — rebuild + push the external-signals provider-runner image
# on `data-platform/scripts/external-signals/**` changes.
#
# Scope: build + push only. The Bicep param `providerRunnerImage` is NOT bumped
# by this workflow — image-tag bumps are a deliberate manual review step, then
# the standard cd-infra-deploy workflow picks up the new tag. Live provider
# bindings (e.g. Web IQ) stay inert until their Key Vault credential is present.

on:
  push:
    branches:
      - main
    paths:
      - 'data-platform/scripts/external-signals/**'
      - '.github/workflows/ci-build-signal-runner.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  ACR_LOGIN_SERVER: 'cri75lbu5sj4hza.azurecr.io'
  IMAGE_NAME: 'signal-runner'

jobs:
  build-and-push:
    name: Build + push signal-runner image
    runs-on: ubuntu-latest
    environment:
      name: sit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        shell: bash
        run: |
          set -euo pipefail
          registry_name="${ACR_LOGIN_SERVER%.azurecr.io}"
          az acr login --name "$registry_name"

      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          {
            echo "sha_tag=$short_sha"
            echo "full_sha=${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${short_sha}"
            echo "full_latest=${ACR_LOGIN_SERVER}/${IMAGE_NAME}:latest"
          } >> "$GITHUB_OUTPUT"

      - name: Docker build
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            -f data-platform/scripts/external-signals/Dockerfile \
            -t "${{ steps.tags.outputs.full_sha }}" \
            -t "${{ steps.tags.outputs.full_latest }}" \
            .

      - name: Docker push
        shell: bash
        run: |
          set -euo pipefail
          docker push "${{ steps.tags.outputs.full_sha }}"
          docker push "${{ steps.tags.outputs.full_latest }}"

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## signal-runner image build"
            echo ""
            echo "- Tag: \`${{ steps.tags.outputs.sha_tag }}\`"
            echo "- Image: \`${{ steps.tags.outputs.full_sha }}\`"
            echo ""
            echo "Bump \`providerRunnerImage\` in the target bicepparam to deploy this tag."
          } >> "$GITHUB_STEP_SUMMARY"
