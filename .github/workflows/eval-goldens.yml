name: Eval Goldens (Legacy Compatibility)

# Structural validator for `agents-archive/<name>/golden-tasks.md` files.
#
# Migration note: Superpowers is the default execution model for new work.
# This workflow remains as a legacy compatibility validator for retained
# per-agent prompt assets.
#
# This workflow does NOT invoke the GitHub Copilot coding agent — manual
# replay against the live agent is the acceptance step (per
# `docs/sprints/sprint-01-orchestrator-mvp.md` §3.1 Runtime Amendment).
#
# What it does:
#   1. Confirms every `agents-archive/<name>/AGENT.md` has a sibling `golden-tasks.md`.
#   2. Confirms every `golden-tasks.md` has at least one happy-path fixture
#      and at least one failure-mode fixture (heuristic: at least two H2
#      sections starting with `Fixture:` and at least one of them mentions
#      `refusal` or `failure-mode`).
#   3. Confirms each fixture H2 section contains the five required H3
#      subsections: Input issue body, Expected MCP tool calls, Expected
#      PR / comment shape, Forbidden behaviours, Requirements verified.
#
# Triggers: PRs touching `agents/**` or this workflow itself, and manual
# `workflow_dispatch` for compatibility replay.

on:
  pull_request:
    paths:
      - "agents-archive/**"
      - ".github/workflows/eval-goldens.yml"
  workflow_dispatch:
    inputs:
      agent:
        description: "Agent name (folder under agents-archive/) to validate. Leave blank for all."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: eval-goldens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-fixtures:
    name: Validate golden-task fixtures
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          AGENT_INPUT="${{ github.event.inputs.agent }}"
          if [[ -n "${AGENT_INPUT}" ]]; then
            agent_dirs=("agents-archive/${AGENT_INPUT}")
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # Validate only touched archived agent folders on PRs to avoid failing on
            # unrelated placeholder fixtures while still enforcing quality on
            # the changed scope.
            mapfile -t changed_agent_dirs < <(
              git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" \
                | grep -E '^agents-archive/[^/]+/' \
                | cut -d/ -f1-2 \
                | sort -u || true
            )
            if [[ ${#changed_agent_dirs[@]} -gt 0 ]]; then
              agent_dirs=("${changed_agent_dirs[@]}")
            else
              echo "::notice::No changed agent folders detected on this PR."
              exit 0
            fi
          else
            agent_dirs=(agents-archive/*/)
          fi

          if [[ ${#agent_dirs[@]} -eq 0 ]]; then
            echo "::notice::No agent folders under agents-archive/ — nothing to validate."
            exit 0
          fi

          fail=0
          for dir in "${agent_dirs[@]}"; do
            agent="$(basename "${dir%/}")"
            echo "::group::Agent: ${agent}"

            agent_md="${dir%/}/AGENT.md"
            goldens_md="${dir%/}/golden-tasks.md"

            if [[ ! -f "${agent_md}" ]]; then
              echo "::error file=${agent_md}::Missing AGENT.md"
              fail=1
              echo "::endgroup::"
              continue
            fi
            if [[ ! -f "${goldens_md}" ]]; then
              echo "::error file=${goldens_md}::Missing golden-tasks.md"
              fail=1
              echo "::endgroup::"
              continue
            fi

            fixture_count=$(grep -cE '^## Fixture(:| [0-9]+:)' "${goldens_md}" || true)
            if [[ "${fixture_count}" -lt 2 ]]; then
              echo "::error file=${goldens_md}::Need >= 2 fixtures (1 happy-path + 1 failure-mode); found ${fixture_count}."
              fail=1
            fi

            if ! grep -qiE '(refusal|failure-mode|no traceability|blocker)' "${goldens_md}"; then
              echo "::error file=${goldens_md}::No fixture indicating refusal/failure-mode semantics."
              fail=1
            fi

            # Support both strict H3 fixture sections and concise bullet-style
            # fixtures used by some agent packs.
            for section in 'Input issue body' 'Expected MCP tool calls' 'Forbidden behaviour(s)?'; do
              if ! grep -qiE "${section}|\*\*${section}\*\*" "${goldens_md}"; then
                echo "::error file=${goldens_md}::Missing required fixture section label: ${section}."
                fail=1
              fi
            done

            if ! grep -qiE 'Expected PR / comment shape|Expected Drift Table|\*\*Expected PR/comment shape\*\*|\*\*Expected PR / comment shape\*\*' "${goldens_md}"; then
              echo "::error file=${goldens_md}::Missing expected outcome section (PR/comment shape or drift table)."
              fail=1
            fi

            if ! grep -qiE 'Requirements verified|\*\*Requirements verified\*\*' "${goldens_md}"; then
              echo "::warning file=${goldens_md}::No explicit 'Requirements verified' section found. Add in next fixture hardening pass."
            fi

            echo "Agent ${agent}: ${fixture_count} fixture(s) validated."
            echo "::endgroup::"
          done

          if [[ "${fail}" -ne 0 ]]; then
            echo "::error::One or more agents failed golden-task validation."
            exit 1
          fi
          echo "All agent fixtures passed structural validation."
