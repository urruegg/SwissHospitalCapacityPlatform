name: Fabric F2 Capacity Lifecycle

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - resume
          - suspend
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - sit
          - prod

permissions:
  id-token: write   # OIDC for az login
  contents: read

jobs:
  lifecycle:
    name: ${{ inputs.action }} ${{ inputs.environment }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure PowerShell available
        shell: bash
        run: |
          if ! command -v pwsh &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y powershell
          fi
          pwsh --version

      - name: Invoke ${{ inputs.action }} on ${{ inputs.environment }}
        shell: pwsh
        run: |
          $script = if ('${{ inputs.action }}' -eq 'resume') {
            './infra/scripts/Resume-FabricCapacity.ps1'
          } else {
            './infra/scripts/Suspend-FabricCapacity.ps1'
          }
          & $script -Environment '${{ inputs.environment }}'

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "## Fabric F2 lifecycle" >> $GITHUB_STEP_SUMMARY
          echo "- Action: **${{ inputs.action }}**" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: **${{ inputs.environment }}**" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
