name: Fabric SIT Keep-Alive

# Sprint 10 T1 temporary override — resumes the SIT F2 capacity every 15 min if paused.
# Sunset when Sprint 10 T1 (issue #108, S10.1) closes. Tracked by issue #126.
# Runbook: docs/runbooks/fabric-capacity-lifecycle.md
# Cost note: F2 24x7 for 4 weeks approx USD 200 max. Acceptable per ADR-0013 demo scope.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: fabric-sit-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    name: Ensure SIT F2 capacity is Active
    runs-on: ubuntu-latest
    environment:
      name: sit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure PowerShell available
        shell: bash
        run: |
          if ! command -v pwsh &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y powershell
          fi
          pwsh --version

      - name: Resume if paused (idempotent)
        shell: pwsh
        run: ./infra/scripts/Resume-FabricCapacity.ps1 -Environment sit

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Fabric SIT keep-alive"
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Status: ${{ job.status }}"
            echo "- Runbook: docs/runbooks/fabric-capacity-lifecycle.md"
          } >> "$GITHUB_STEP_SUMMARY"
