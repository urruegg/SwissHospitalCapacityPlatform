name: curavias-web-deploy

# Sprint 24 (#266) — build the Curavias Astro landing page (apps/curavias-web) and,
# on explicit human approval, deploy the static output to the PROD Azure Static Web App
# (stapp-ihzhhpf-prod, curavias.ch / www.curavias.ch).
#
# Scope split (defence in depth, mirrors cd-infra-deploy-prod.yml):
#   * build       — runs on PRs + pushes to main + dispatch. No cloud credentials.
#   * deploy-prod — runs ONLY on workflow_dispatch with confirm='approved-to-apply',
#                   behind the `prod` GitHub Environment (reviewer approval). Uses OIDC.
# The Static Web App itself is provisioned by infra/main.bicep (enableCuraviasWebModule);
# this workflow only uploads content via the SWA deployment token.

on:
  push:
    branches:
      - main
    paths:
      - 'apps/curavias-web/**'
      - '.github/workflows/curavias-web-deploy.yml'
  pull_request:
    paths:
      - 'apps/curavias-web/**'
      - '.github/workflows/curavias-web-deploy.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: Type 'approved-to-apply' to confirm the PROD content deployment.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: curavias-web-deploy-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: apps/curavias-web

jobs:
  build:
    name: Build (astro check + build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/curavias-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: curavias-web-dist
          path: apps/curavias-web/dist
          if-no-files-found: error
          retention-days: 7

  deploy-prod:
    name: Deploy PROD (approval-gated)
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: prod
      url: https://curavias.ch
    permissions:
      contents: read
      id-token: write
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.confirm == 'approved-to-apply'
    steps:
      - name: Validate required environment configuration (PROD)
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          test -n "$AZURE_CLIENT_ID"
          test -n "$AZURE_TENANT_ID"
          test -n "$AZURE_SUBSCRIPTION_ID"
          test -n "$AZURE_RESOURCE_GROUP"

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: curavias-web-dist
          path: apps/curavias-web/dist

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Static Web App deployment token
        id: swa
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          SWA_NAME: ${{ vars.CURAVIAS_SWA_NAME || 'stapp-ihzhhpf-prod' }}
        run: |
          set -euo pipefail
          token=$(az staticwebapp secrets list \
            --name "$SWA_NAME" \
            --resource-group "$RG" \
            --query "properties.apiKey" -o tsv)
          test -n "$token"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Deploy static content to SWA (PROD)
        env:
          SWA_TOKEN: ${{ steps.swa.outputs.token }}
        run: |
          set -euo pipefail
          npx -y @azure/static-web-apps-cli@2 deploy ./dist \
            --deployment-token "$SWA_TOKEN" \
            --env production

      - name: Summary
        if: always()
        run: |
          {
            echo "## Curavias web PROD deploy"
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Target: stapp-ihzhhpf-prod (https://curavias.ch)"
            echo "- Status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
