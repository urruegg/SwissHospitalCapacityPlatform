name: app-a11y

# Sprint 13 T1 — axe-core accessibility scan (WCAG 2.1 AA target, design spec
# §8). Serious/critical violations fail the job and block merge.

on:
  pull_request:
    paths:
      - 'apps/hcc-app-fluent/**'
      - '.github/workflows/app-a11y.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/hcc-app-fluent/**'
      - '.github/workflows/app-a11y.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a11y:
    name: hcc-app-fluent — axe-core scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/hcc-app-fluent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/hcc-app-fluent/package-lock.json

      - name: Install
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Accessibility scan
        run: npm run test:a11y
