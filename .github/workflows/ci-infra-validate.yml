name: ci-infra-validate

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/**'
      - 'docs/SD.md'
      - 'docs/ARCHITECTURE.md'
      - 'docs/INFRASTRUCTURE.md'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  detect-doc-changes:
    name: Detect doc changes
    runs-on: ubuntu-latest
    outputs:
      docs_changed: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed docs
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docs:
              - 'docs/SD.md'
              - 'docs/ARCHITECTURE.md'
              - 'docs/INFRASTRUCTURE.md'

  docs-quality:
    name: Markdown lint and link check
    runs-on: ubuntu-latest
    needs: detect-doc-changes
    if: needs.detect-doc-changes.outputs.docs_changed == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run markdown lint
        shell: bash
        run: |
          set -euo pipefail
          npx --yes markdownlint-cli2@0.15.0 docs/SD.md docs/ARCHITECTURE.md docs/INFRASTRUCTURE.md

      - name: Run markdown link check
        shell: bash
        run: |
          set -euo pipefail
          files=(
            docs/SD.md
            docs/ARCHITECTURE.md
            docs/INFRASTRUCTURE.md
          )

          for f in "${files[@]}"; do
            [ -f "$f" ] || continue
            npx --yes markdown-link-check "$f"
          done

  bicep-build:
    name: Bicep build and params compile
    runs-on: ubuntu-latest
    needs:
      - detect-doc-changes
      - docs-quality
    if: always() && (needs.detect-doc-changes.result == 'success') && (needs.docs-quality.result == 'success' || needs.docs-quality.result == 'skipped')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Bicep is available
        shell: bash
        run: |
          set -euo pipefail
          az bicep version || az bicep install

      - name: Build Bicep templates
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          for f in infra/**/*.bicep; do
            [ -f "$f" ] || continue
            az bicep build --file "$f" --stdout >/dev/null
          done

      - name: Lint Bicep templates
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          for f in infra/**/*.bicep; do
            [ -f "$f" ] || continue
            az bicep lint --file "$f"
          done

      - name: Build Bicep parameter files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          for f in infra/**/*.bicepparam; do
            [ -f "$f" ] || continue
            az bicep build-params --file "$f" --stdout >/dev/null
          done

  what-if-sit:
    name: What-if SIT
    runs-on: ubuntu-latest
    environment:
      name: sit
    needs: bicep-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required environment configuration (SIT)
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          BICEP_PARAM_FILE: ${{ vars.BICEP_PARAM_FILE }}
        run: |
          set -euo pipefail
          test -n "$AZURE_CLIENT_ID"
          test -n "$AZURE_TENANT_ID"
          test -n "$AZURE_SUBSCRIPTION_ID"
          test -n "$AZURE_RESOURCE_GROUP"
          test -n "$BICEP_PARAM_FILE"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: What-if (SIT)
        shell: bash
        run: |
          set -euo pipefail
          az deployment group what-if \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters "${{ vars.BICEP_PARAM_FILE }}"

  what-if-prod:
    name: What-if PROD
    runs-on: ubuntu-latest
    environment:
      name: prod
    needs: bicep-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required environment configuration (PROD)
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          BICEP_PARAM_FILE: ${{ vars.BICEP_PARAM_FILE }}
        run: |
          set -euo pipefail
          test -n "$AZURE_CLIENT_ID"
          test -n "$AZURE_TENANT_ID"
          test -n "$AZURE_SUBSCRIPTION_ID"
          test -n "$AZURE_RESOURCE_GROUP"
          test -n "$BICEP_PARAM_FILE"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: What-if (PROD)
        shell: bash
        run: |
          set -euo pipefail
          az deployment group what-if \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters "${{ vars.BICEP_PARAM_FILE }}"

  deployed-parity-check:
    name: Deployed parity check (SIT vs PROD)
    runs-on: ubuntu-latest
    environment:
      name: sit
    needs:
      - what-if-sit
      - what-if-prod
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Compare deployed resource types
        shell: bash
        run: |
          set -euo pipefail

          sit_rg='rg-ihzhhpf-sit'
          prod_rg='rg-ihzhhpf-prod'

          sit_types=$(az resource list -g "$sit_rg" --query "[].type" -o tsv | tr '[:upper:]' '[:lower:]' | sort -u)
          prod_types=$(az resource list -g "$prod_rg" --query "[].type" -o tsv | tr '[:upper:]' '[:lower:]' | sort -u)

          echo 'SIT resource types:'
          printf '%s\n' "$sit_types"
          echo 'PROD resource types:'
          printf '%s\n' "$prod_types"

          sit_only_raw=$(comm -23 <(printf '%s\n' "$sit_types") <(printf '%s\n' "$prod_types") || true)
          prod_only=$(comm -13 <(printf '%s\n' "$sit_types") <(printf '%s\n' "$prod_types") || true)

          allow_sit_only='microsoft.insights/actiongroups'
          sit_only=''
          while IFS= read -r t; do
            [ -z "$t" ] && continue
            if [ "$t" != "$allow_sit_only" ]; then
              sit_only+="$t"$'\n'
            fi
          done <<< "$sit_only_raw"

          if [ -n "$sit_only" ] || [ -n "$prod_only" ]; then
            echo 'Unexpected parity drift detected.'
            [ -z "$sit_only" ] || { echo 'Unexpected SIT-only types:'; printf '%s\n' "$sit_only"; }
            [ -z "$prod_only" ] || { echo 'Unexpected PROD-only types:'; printf '%s\n' "$prod_only"; }
            exit 1
          fi

          echo "Parity check passed. Allowed SIT-only type: $allow_sit_only"
