name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: |
            **/*.md
            #node_modules
            #.actionlint

  markdown-link-check:
    name: Markdown link check
    runs-on: ubuntu-latest
    # Disabled: lychee's URL extractor mis-parses hyphenated prose
    # phrases (e.g. "AI-Powered", "Patient Flow") as phantom URLs
    # and produces 100% false positives on this repo's docs. Restore
    # with a link-syntax-only checker (e.g. gaurav-nelson/github-action-
    # markdown-link-check) once a published docs site exists.
    if: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Link check (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.18.1
          args: >-
            --no-progress
            --max-concurrency 4
            docs/**/*.md
            sprints/*.md
            .github/*.md
            AGENTS.md
            README.md
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  actionlint:
    name: actionlint (workflows)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run actionlint
        uses: raven-actions/actionlint@v2
        with:
          fail-on-error: true

  bicep-build:
    name: Bicep build (infra/landing-zone)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Azure CLI is available
        shell: bash
        run: |
          set -euo pipefail
          if command -v az >/dev/null 2>&1; then
            az version
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y azure-cli
          az version

      - name: Build all Bicep templates under infra/**
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          # azure-cli ships with bicep on ubuntu-latest runners; ensure it's available.
          if ! az bicep version >/dev/null 2>&1; then
            az bicep install
          fi
          az bicep version
          found=0
          for f in infra/**/*.bicep; do
            [ -f "$f" ] || continue
            found=1
            echo "::group::$f"
            az bicep build --file "$f" --stdout >/dev/null
            echo "::endgroup::"
          done
          for f in infra/**/*.bicepparam; do
            [ -f "$f" ] || continue
            found=1
            echo "::group::$f"
            az bicep build-params --file "$f" --stdout >/dev/null
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "::notice::No Bicep files under infra/ — skipping."
          fi

