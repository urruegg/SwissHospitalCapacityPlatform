name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            infra:
              - 'infra/**'
              - '**/*.bicep'
              - '**/*.bicepparam'
            workflows:
              - '.github/workflows/**'
              - '.actionlint.yaml'
              - '.actionlint.yml'

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: |
            **/*.md
            #node_modules
            #.actionlint

  # Markdown link check intentionally not run in CI: lychee's URL
  # extractor mis-parses hyphenated prose ("AI-Powered", "Patient
  # Flow", ...) as phantom URLs, producing 100% false positives on
  # this repo's docs. Reintroduce a link-syntax-only checker (e.g.
  # gaurav-nelson/github-action-markdown-link-check) once a published
  # docs site exists.

  actionlint:
    name: actionlint (workflows)
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run actionlint
        uses: raven-actions/actionlint@v2
        with:
          fail-on-error: true

  mojibake-scan:
    name: Mojibake scan (encoding integrity)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan tracked text files for double-encoded UTF-8
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: python3 scripts/lint/check_mojibake.py

      - name: Self-test the mojibake checker
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: python3 scripts/lint/tests/test_check_mojibake.py

  bicep-build:
    name: Bicep build (infra/landing-zone)
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Azure CLI is available
        shell: bash
        run: |
          set -euo pipefail
          if command -v az >/dev/null 2>&1; then
            az version
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y azure-cli
          az version

      - name: Build all Bicep templates under infra/**
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          # azure-cli ships with bicep on ubuntu-latest runners; ensure it's available.
          if ! az bicep version >/dev/null 2>&1; then
            az bicep install
          fi
          az bicep version
          found=0
          for f in infra/**/*.bicep; do
            [ -f "$f" ] || continue
            found=1
            echo "::group::$f"
            az bicep build --file "$f" --stdout >/dev/null
            echo "::endgroup::"
          done
          for f in infra/**/*.bicepparam; do
            [ -f "$f" ] || continue
            found=1
            echo "::group::$f"
            az bicep build-params --file "$f" --stdout >/dev/null
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "::notice::No Bicep files under infra/ — skipping."
          fi

