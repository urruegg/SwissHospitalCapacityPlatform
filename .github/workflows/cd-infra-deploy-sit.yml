name: cd-infra-deploy-sit

on:
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - '.github/workflows/cd-infra-deploy-sit.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-sit:
    name: Deploy SIT
    runs-on: ubuntu-latest
    environment:
      name: sit
    if: secrets.AZURE_CLIENT_ID != '' && vars.AZURE_TENANT_ID != '' && vars.AZURE_SUBSCRIPTION_ID != '' && vars.AZURE_RESOURCE_GROUP != '' && vars.BICEP_PARAM_FILE != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: What-if before deploy (SIT)
        shell: bash
        run: |
          set -euo pipefail
          az deployment group what-if \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters "${{ vars.BICEP_PARAM_FILE }}"

      - name: Deploy (SIT)
        shell: bash
        run: |
          set -euo pipefail
          az deployment group create \
            --name "deploy-sit-${{ github.run_id }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters "${{ vars.BICEP_PARAM_FILE }}"
