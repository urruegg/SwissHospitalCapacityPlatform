name: cd-infra-deploy-sit

on:
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - '.github/workflows/cd-infra-deploy-sit.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-sit:
    name: Deploy SIT
    runs-on: ubuntu-latest
    environment:
      name: sit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Policy gate (SIT, blocking)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p policy-evidence
          python3 policy/policy_gate.py \
            --scope sit \
            --repo-root . \
            --pipeline-run-id "${GITHUB_RUN_ID}" \
            --output "policy-evidence/policy-gate-sit.json"

      - name: Upload SIT policy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-gate-evidence-sit
          path: policy-evidence/
          if-no-files-found: error

      - name: Validate required environment configuration (SIT)
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          BICEP_PARAM_FILE: ${{ vars.BICEP_PARAM_FILE }}
        run: |
          set -euo pipefail
          test -n "$AZURE_CLIENT_ID"
          test -n "$AZURE_TENANT_ID"
          test -n "$AZURE_SUBSCRIPTION_ID"
          test -n "$AZURE_RESOURCE_GROUP"
          test -n "$BICEP_PARAM_FILE"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure required resource providers are registered (SIT)
        shell: bash
        run: |
          set -euo pipefail
          providers=(
            Microsoft.OperationalInsights
            Microsoft.KeyVault
            Microsoft.ManagedIdentity
            Microsoft.Network
            Microsoft.Insights
            Microsoft.Storage
            Microsoft.CognitiveServices
            Microsoft.ServiceBus
            Microsoft.Web
            Microsoft.ContainerRegistry
            Microsoft.EventHub
            Microsoft.MachineLearningServices
            Microsoft.Logic
            # Microsoft.App = Container Apps control plane. Required whenever
            # a Container Apps Environment or Container App resource is
            # deployed. Historically auto-registered by first CAE create,
            # but declaring it explicitly makes the workflow bulletproof.
            Microsoft.App
            # Microsoft.ContainerService = required for Container Apps
            # Environment VNet integration (ADR-0029 Option A). The CAE
            # internally provisions AKS-managed infra when infrastructureSubnetId
            # is set; without this RP the deploy fails with
            # SubscriptionIsNotRegistered on Microsoft.App/managedEnvironments.
            Microsoft.ContainerService
          )

          for p in "${providers[@]}"; do
            state=$(az provider show --namespace "$p" --query registrationState -o tsv || echo "NotRegistered")
            if [ "$state" != "Registered" ]; then
              if ! az provider register --namespace "$p" --wait; then
                echo "::warning::Unable to register provider $p. Continuing with current registration state."
              fi
            fi
          done

          # ADR-0029 Option A - subscription-level FEATURE flags (not RPs) that
          # Container Apps Environments need when infrastructureSubnetId is set.
          # AllowBringYourOwnPublicIpAddress is required by the CAE's internal
          # cluster provisioning; without it the CAE reaches provisioningState
          # Failed with SubscriptionNotRegisteredForFeature on
          # Microsoft.Network/AllowBringYourOwnPublicIpAddress. Registering the
          # feature is idempotent and does not consume any billable resource.
          features=(
            "Microsoft.Network/AllowBringYourOwnPublicIpAddress"
          )
          for f in "${features[@]}"; do
            ns="${f%/*}"
            name="${f#*/}"
            state=$(az feature show --namespace "$ns" --name "$name" --query properties.state -o tsv || echo "NotRegistered")
            if [ "$state" != "Registered" ]; then
              az feature register --namespace "$ns" --name "$name" >/dev/null || \
                echo "::warning::Unable to register feature $f. Deploy may fail."
              # Propagate to the RP (Azure requires this after a feature register).
              az provider register --namespace "$ns" --wait >/dev/null || true
            fi
          done

      - name: Resume Fabric capacity (SIT) before deploy
        shell: bash
        run: |
          set -euo pipefail
          # A suspended Fabric F2 capacity rejects ARM update writes with
          # BadRequest "Service is not ready to be updated", failing the
          # data-platform -> fabric-foundation nested deployment. Resume it
          # first and wait until Active. Idempotent: no-op when already Active.
          # Mirrors infra/scripts/Resume-FabricCapacity.ps1 (adds a wait loop).
          CAP_ID="/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ vars.AZURE_RESOURCE_GROUP }}/providers/Microsoft.Fabric/capacities/fabricihzhhpfsit"
          state=$(az resource show --ids "$CAP_ID" --query "properties.state" -o tsv 2>/dev/null || echo "Unknown")
          echo "Fabric capacity current state: $state"
          if [ "$state" != "Active" ]; then
            echo "Resuming Fabric capacity..."
            az resource invoke-action --ids "$CAP_ID" --action resume >/dev/null
          fi
          for i in $(seq 1 30); do
            state=$(az resource show --ids "$CAP_ID" --query "properties.state" -o tsv 2>/dev/null || echo "Unknown")
            echo "  [$i] state=$state"
            if [ "$state" = "Active" ]; then break; fi
            sleep 10
          done
          if [ "$state" != "Active" ]; then
            echo "::error::Fabric capacity fabricihzhhpfsit did not reach Active in time (state=$state)"
            exit 1
          fi
          echo "Fabric capacity is Active."

      - name: What-if before deploy (SIT)
        shell: bash
        run: |
          set -euo pipefail
          az deployment group what-if \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters "${{ vars.BICEP_PARAM_FILE }}"

      - name: Deploy (SIT)
        shell: bash
        run: |
          set -euo pipefail
          az deployment group create \
            --name "deploy-sit-${{ github.run_id }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters "${{ vars.BICEP_PARAM_FILE }}"

      - name: Verify deployed SIT release and dependencies
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          BICEP_PARAM_FILE: ${{ vars.BICEP_PARAM_FILE }}
        run: |
          set -euo pipefail
          mkdir -p sit-deployment-evidence
          parameters_json="${RUNNER_TEMP}/sit-parameters.json"
          az bicep build-params \
            --file "${BICEP_PARAM_FILE}" \
            --outfile "${parameters_json}"
          python3 infra/scripts/verify_sit_deployment.py \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --deployment-name "deploy-sit-${GITHUB_RUN_ID}" \
            --parameters-json "${parameters_json}" \
            --output sit-deployment-evidence/verification.json

      - name: Upload SIT deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sit-deployment-evidence-${{ github.run_id }}
          path: sit-deployment-evidence/
          if-no-files-found: error
