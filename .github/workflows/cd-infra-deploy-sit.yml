name: cd-infra-deploy-sit

on:
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - '.github/workflows/cd-infra-deploy-sit.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-sit:
    name: Deploy SIT
    runs-on: ubuntu-latest
    environment:
      name: sit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Policy gate (SIT, blocking)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p policy-evidence
          python3 policy/policy_gate.py \
            --scope sit \
            --repo-root . \
            --pipeline-run-id "${GITHUB_RUN_ID}" \
            --output "policy-evidence/policy-gate-sit.json"

      - name: Upload SIT policy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-gate-evidence-sit
          path: policy-evidence/
          if-no-files-found: error

      - name: Validate required environment configuration (SIT)
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          BICEP_PARAM_FILE: ${{ vars.BICEP_PARAM_FILE }}
        run: |
          set -euo pipefail
          test -n "$AZURE_CLIENT_ID"
          test -n "$AZURE_TENANT_ID"
          test -n "$AZURE_SUBSCRIPTION_ID"
          test -n "$AZURE_RESOURCE_GROUP"
          test -n "$BICEP_PARAM_FILE"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure required resource providers are registered (SIT)
        shell: bash
        run: |
          set -euo pipefail
          providers=(
            Microsoft.OperationalInsights
            Microsoft.KeyVault
            Microsoft.ManagedIdentity
            Microsoft.Network
            Microsoft.Insights
            Microsoft.Storage
            Microsoft.CognitiveServices
            Microsoft.ServiceBus
            Microsoft.Web
            Microsoft.ContainerRegistry
            Microsoft.EventHub
            Microsoft.MachineLearningServices
            Microsoft.Logic
            Microsoft.App
            Microsoft.Cache
            Microsoft.DocumentDB
          )

          for p in "${providers[@]}"; do
            state=$(az provider show --namespace "$p" --query registrationState -o tsv || echo "NotRegistered")
            if [ "$state" != "Registered" ]; then
              if ! az provider register --namespace "$p" --wait; then
                echo "::warning::Unable to register provider $p. Continuing with current registration state."
              fi
            fi
          done

      - name: What-if before deploy (SIT)
        shell: bash
        run: |
          set -euo pipefail
          az deployment group what-if \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters "${{ vars.BICEP_PARAM_FILE }}"

      - name: Deploy (SIT)
        shell: bash
        run: |
          set -euo pipefail
          az deployment group create \
            --name "deploy-sit-${{ github.run_id }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters "${{ vars.BICEP_PARAM_FILE }}"
