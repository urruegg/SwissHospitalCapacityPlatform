name: superpowers-compliance

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: superpowers-compliance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-contract:
    name: Validate Superpowers PR Contract
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request != null }}
    steps:
      - name: Validate required PR sections and fields
        uses: actions/github-script@v7
        with:
          script: |
            // Primary source: PR body. Secondary source: SUPERPOWERS_CONTRACT.md committed to
            // the PR head branch. AI agents that cannot edit PR descriptions may fulfil the
            // contract by committing SUPERPOWERS_CONTRACT.md instead.
            let prBody = (context.payload.pull_request.body || "").toString();

            let contractFileBody = "";
            try {
              const { data: file } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: "SUPERPOWERS_CONTRACT.md",
                ref: context.payload.pull_request.head.sha,
              });
              contractFileBody = Buffer.from(file.content, "base64").toString("utf-8");
              core.info("Found SUPERPOWERS_CONTRACT.md in PR head — merging with PR body for validation.");
            } catch (_) {
              core.info("No SUPERPOWERS_CONTRACT.md found in PR head — validating PR body only.");
            }

            const body = prBody + "\n" + contractFileBody;
            const missing = [];

            const requiredSnippets = [
              "## Linked Issue / Work Item",
              "Parent sprint issue:",
              "Delivery issue for this PR:",
              "## Execution Mode",
              "## Skill Applicability and Evidence",
              "writing-plans",
              "test-driven-development",
              "systematic-debugging",
              "verification-before-completion",
              "Legacy mode approval issue:"
            ];

            for (const token of requiredSnippets) {
              if (!body.includes(token)) {
                missing.push(`Missing required PR contract token: ${token}`);
              }
            }

            const legacyChecked = /- \[x\]\s*`legacy-agent-compat`/i.test(body);
            if (legacyChecked) {
              if (!/Legacy mode approval issue:\s*`?#\d+/i.test(body)) {
                missing.push("legacy-agent-compat is checked but Legacy mode approval issue is missing or invalid.");
              }
            }

            const requiredIssueRefs = [
              /Parent sprint issue:\s*`?#\d+/i,
              /Delivery issue for this PR:\s*`?#\d+/i,
              /Sprint issue link:\s*`?#\d+/i,
            ];

            for (const pattern of requiredIssueRefs) {
              if (!pattern.test(body)) {
                missing.push(`Missing required issue reference matching ${pattern}`);
              }
            }

            if (missing.length > 0) {
              core.setFailed(
                missing.join("\n") +
                "\n\nFix: update the PR description to include all required sections from " +
                ".github/PULL_REQUEST_TEMPLATE.md, or commit SUPERPOWERS_CONTRACT.md to the " +
                "PR branch with the required sections."
              );
            } else {
              core.info("Superpowers PR contract validated.");
            }
