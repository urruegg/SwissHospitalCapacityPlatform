name: "UC2 — Drift scan"
description: "Run a Superpowers-driven drift scan to compare a subscription against its spec."
title: "[UC2] Drift scan: <subscription-name-or-id>"
labels: ["uc2", "needs-triage"]
assignees: ["copilot"]
body:
  - type: markdown
    attributes:
      value: |
        > Triggers a **Superpowers-first** UC2 flow.
        > Copilot scans the subscription read-only via `azure-mcp`, diffs
        > against the repo-managed source artefacts UC1 owns, and writes a drift report to this issue plus a reproducible branch sidecar.
        > Remediation PRs are routed through the UC1 workflow,
        > never opened directly by `drift-analyzer`.
        >
        > **Side-effect ceiling**: `write` (GitHub issue + branch artefacts only — no
        > Azure mutations).

  - type: dropdown
    id: execution_mode
    attributes:
      label: Execution mode
      description: "Default is Superpowers. Legacy mode is for compatibility checks only."
      options:
        - "superpowers (default)"
        - "legacy-agent-compat"
      default: 0
    validations:
      required: true

  - type: input
    id: target_subscription
    attributes:
      label: Target Azure subscription ID
      description: "GUID of the subscription to scan."
      placeholder: "00000000-0000-0000-0000-000000000000"
    validations:
      required: true

  - type: input
    id: spec_reference
    attributes:
      label: Spec reference (repo path)
      description: "The repo-managed source artefact the live subscription should be compared against."
      placeholder: "docs/specs/Swiss AI-Powered Patient Flow and Hospital Capacity Platform.md"
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Scan scope
      options:
        - "full subscription"
        - "single resource group"
        - "tag-filtered"
      default: 0
    validations:
      required: true

  - type: input
    id: scope_filter
    attributes:
      label: Scope filter (RG name or tag expression)
      description: "Required if scope is 'single resource group' or 'tag-filtered'. Leave blank for full subscription."
      placeholder: "rg-prod-eu OR tags['env']='prod'"
    validations:
      required: false

  - type: textarea
    id: requirements
    attributes:
      label: PRD requirements implemented
      description: "List the `FR-UC2-*` / `NFR-*` IDs from `docs/PRD.md` this run advances."
      placeholder: "FR-UC2-001, FR-UC2-004"
    validations:
      required: true

  - type: checkboxes
    id: applicable_skills
    attributes:
      label: Applicable Superpowers skills
      description: "Select every skill that applies for this run."
      options:
        - label: "writing-plans"
        - label: "test-driven-development"
        - label: "systematic-debugging"
        - label: "verification-before-completion"
    validations:
      required: true

  - type: textarea
    id: non_applicable_rationale
    attributes:
      label: Non-applicable skill rationale
      description: "For each non-selected core skill, provide why it does not apply."
      placeholder: "test-driven-development: read-only drift analysis"
    validations:
      required: true

  - type: input
    id: legacy_mode_approval_issue
    attributes:
      label: Legacy mode approval issue
      description: "Required only when execution mode is legacy-agent-compat."
      placeholder: "#123"
    validations:
      required: false

  - type: checkboxes
    id: acks
    attributes:
      label: Acknowledgements
      options:
        - label: "I confirm this scan is **read-only** against the target subscription."
          required: true
        - label: "If I selected legacy-agent-compat, I provided an approval issue reference."
          required: true
