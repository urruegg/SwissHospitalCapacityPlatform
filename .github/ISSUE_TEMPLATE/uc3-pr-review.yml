name: "UC3 — PR review"
description: "Run a Superpowers-driven PR review flow to comment on a GitHub pull request."
title: "[UC3] Review GitHub PR: <pr-id>"
labels: ["uc3", "needs-triage"]
assignees: ["copilot"]
body:
  - type: markdown
    attributes:
      value: |
        > Triggers a **Superpowers-first** UC3 flow.
        > Copilot reads the PR via GitHub-native context and posts a single,
        > idempotent review comment marked with
        > `<!-- agentic-devops:pr-review -->`. Re-runs update the same comment
        > rather than appending duplicates.
        >
        > **Side-effect ceiling**: `write` (GitHub comments only).
        > **Latency target**: < 60 s p95 from PR-created event to comment.

  - type: dropdown
    id: execution_mode
    attributes:
      label: Execution mode
      description: "Default is Superpowers. Legacy mode is for compatibility checks only."
      options:
        - "superpowers (default)"
        - "legacy-agent-compat"
      default: 0
    validations:
      required: true

  - type: input
    id: github_pr_url
    attributes:
      label: GitHub PR URL
      description: "Full URL to the pull request."
      placeholder: "https://github.com/<owner>/<repo>/pull/<id>"
    validations:
      required: true

  - type: input
    id: github_event_id
    attributes:
      label: GitHub event ID (optional)
      description: "Populated automatically by the webhook receiver workflow; leave blank for manual runs."
      placeholder: "auto-populated"
    validations:
      required: false

  - type: dropdown
    id: trigger_source
    attributes:
      label: Trigger source
      options:
        - "GitHub webhook or workflow (automatic)"
        - "Manual run"
      default: 0
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: PRD requirements implemented
      description: "List the `FR-UC3-*` / `NFR-*` IDs from `docs/PRD.md` this run advances."
      placeholder: "FR-UC3-001, FR-UC3-003"
    validations:
      required: true

  - type: checkboxes
    id: applicable_skills
    attributes:
      label: Applicable Superpowers skills
      description: "Select every skill that applies for this run."
      options:
        - label: "writing-plans"
        - label: "test-driven-development"
        - label: "systematic-debugging"
        - label: "verification-before-completion"
    validations:
      required: true

  - type: textarea
    id: non_applicable_rationale
    attributes:
      label: Non-applicable skill rationale
      description: "For each non-selected core skill, provide why it does not apply."
      placeholder: "test-driven-development: review-only issue"
    validations:
      required: true

  - type: input
    id: legacy_mode_approval_issue
    attributes:
      label: Legacy mode approval issue
      description: "Required only when execution mode is legacy-agent-compat."
      placeholder: "#123"
    validations:
      required: false

  - type: checkboxes
    id: acks
    attributes:
      label: Acknowledgements
      options:
        - label: "I confirm the pr-review agent only posts comments and never modifies code or PR status."
          required: true
        - label: "If I selected legacy-agent-compat, I provided an approval issue reference."
          required: true
