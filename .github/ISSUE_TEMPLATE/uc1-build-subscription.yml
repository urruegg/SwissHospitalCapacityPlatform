name: "UC1 — Build landing-zone subscription"
description: "Run a Superpowers-driven UC1 flow to assemble a landing-zone PR from repo-managed markdown sources."
title: "[UC1] Build subscription: <short-name>"
labels: ["uc1", "needs-triage"]
assignees: ["copilot"]
body:
  - type: markdown
    attributes:
      value: |
        > Triggers a **Superpowers-first** UC1 flow.
        > Copilot reads the canonical markdown source set from `docs/` and
        > `docs/specs/`, generates Bicep parameters, and opens a GitHub PR for
        > the customer landing zone plan.
        > A `what-if` plan is produced first; a human must comment
        > `approved-to-apply` before any deploy fires
        > (per [AGENTS.md §4](../../AGENTS.md#4-confirmation-rule-for-deploy--delete)).

  - type: dropdown
    id: execution_mode
    attributes:
      label: Execution mode
      description: "Default is Superpowers. Legacy mode is for compatibility checks only."
      options:
        - "superpowers (default)"
        - "legacy-agent-compat"
      default: 0
    validations:
      required: true

  - type: textarea
    id: spec_sources
    attributes:
      label: Source markdown paths
      description: "List the repo paths under docs/ and docs/specs/ that define the request scope."
      placeholder: "docs/PRD.md\ndocs/ARCHITECTURE.md\ndocs/specs/Swiss AI-Powered Patient Flow and Hospital Capacity Platform.md"
    validations:
      required: true

  - type: input
    id: target_subscription
    attributes:
      label: Target Azure subscription ID
      description: "GUID of the customer subscription the landing zone will be deployed into."
      placeholder: "00000000-0000-0000-0000-000000000000"
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: Stage
      description: "Plan-only produces a `what-if` and PR; Apply additionally requires `approved-to-apply`."
      options:
        - "plan-only (default; recommended for first run)"
        - "plan-then-await-approval"
      default: 0
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: PRD requirements implemented
      description: "List the `FR-UC1-*` / `NFR-*` IDs from `docs/PRD.md` this run advances."
      placeholder: "FR-UC1-001, FR-UC1-005"
    validations:
      required: true

  - type: checkboxes
    id: acks
    attributes:
      label: Acknowledgements
      options:
        - label: "I confirm the canonical source for this run is the repo-managed markdown set under docs/ and docs/specs/."
          required: true
        - label: "I am authorised to request a landing zone for the target subscription."
          required: true
