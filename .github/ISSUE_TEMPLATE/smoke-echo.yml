name: "Smoke — superpowers echo"
description: "Smoke fixture: run a Superpowers-driven echo request with no cloud mutations."
title: "[SMOKE] superpowers echo — <short-tag>"
labels: ["smoke", "needs-triage"]
assignees: ["copilot"]
body:
  - type: markdown
    attributes:
      value: |
        > Triggers a **Superpowers-first** execution flow using GitHub Copilot.
        > This smoke run validates issue intake and execution-mode handling.
        > No Azure mutations are allowed.

  - type: dropdown
    id: execution_mode
    attributes:
      label: Execution mode
      description: "Default is Superpowers. Legacy mode is for compatibility checks only."
      options:
        - "superpowers (default)"
        - "legacy-agent-compat"
      default: 0
    validations:
      required: true

  - type: input
    id: echo_phrase
    attributes:
      label: Echo phrase
      description: "A short phrase Copilot should echo in the first response."
      placeholder: "Sprint 1 complete"
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: PRD requirements verified
      description: "List the `FR-*` / `NFR-*` IDs from `docs/PRD.md` this smoke run verifies."
      placeholder: "FR-PLT-001, NFR-MAINT-002"
      value: |
        FR-PLT-001
        NFR-MAINT-002
    validations:
      required: true

  - type: checkboxes
    id: applicable_skills
    attributes:
      label: Applicable Superpowers skills
      description: "Select every skill that applies for this run."
      options:
        - label: "writing-plans"
        - label: "test-driven-development"
        - label: "systematic-debugging"
        - label: "verification-before-completion"
    validations:
      required: true

  - type: textarea
    id: non_applicable_rationale
    attributes:
      label: Non-applicable skill rationale
      description: "For each non-selected core skill, provide why it does not apply."
      placeholder: "test-driven-development: documentation-only smoke flow"
    validations:
      required: true

  - type: input
    id: legacy_mode_approval_issue
    attributes:
      label: Legacy mode approval issue
      description: "Required only when execution mode is legacy-agent-compat."
      placeholder: "#123"
    validations:
      required: false

  - type: dropdown
    id: auto_apply
    attributes:
      label: Auto-apply lightweight smoke plan
      description: "Use yes for smoke-only runs. Deploy/delete operations still require explicit approval gating."
      options:
        - "yes"
        - "no (wait for human comment)"
      default: 0
    validations:
      required: true

  - type: checkboxes
    id: acks
    attributes:
      label: Acknowledgements
      options:
        - label: "This is a smoke run only. No production data and no Azure mutations."
          required: true
        - label: "If I selected legacy-agent-compat, I provided an approval issue reference."
          required: true
