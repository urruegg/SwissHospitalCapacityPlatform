name: "BVA report page (Sprint 15)"
description: "Add or change a C-suite BVA Power BI page or its RLS routing."
title: "[BVA-page] <persona> landing — <change>"
labels: ["sprint-15", "bva", "rls"]
assignees:
  - urruegg
body:
  - type: markdown
    attributes:
      value: |
        > Adds or changes a C-suite BVA Power BI page under
        > `data-platform/reports/bva-boardroom.Report/`. Report publish and RLS
        > role assignment are both `deploy`-ceiling actions gated by
        > `approved-to-apply` (AGENTS.md §4, design spec §12). RLS expectations
        > live in `data-platform/reports/tests/bva-rls-test-plan.md`.

  - type: dropdown
    id: persona
    attributes:
      label: Persona landing page
      options:
        - CEO
        - CFO
        - CIO
        - COO
        - CTO
        - Board-summary (shared)
    validations:
      required: true

  - type: dropdown
    id: change-kind
    attributes:
      label: Change kind
      options:
        - New page
        - Visual add/change
        - RLS role / routing change
        - Theme / layout change
    validations:
      required: true

  - type: input
    id: headline-kpi
    attributes:
      label: Headline KPI shown on this landing (design spec §6)
      placeholder: "Actual TCO vs. budget + payback tracking"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What should change and why
      placeholder: "Add run-cost variance small-multiples to the CFO landing ..."
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Author checklist
      options:
        - label: Updated the page under data-platform/reports/bva-boardroom.Report/
          required: true
        - label: If RLS changed, updated bva-rls-test-plan.md with expected row counts per persona x hospital
          required: true
        - label: Confirmed demo.guest still sees Aggregated + Board-summary only
          required: true
